; Stamina Master 0.1.0 for Crimson Desert 2.03.00 (exe 1.0.0.2944).
;
; Out of the box nothing you do on foot costs stamina at all. Raise the numbers
; below if you would rather have it cheaper than free.
;
; The first three are a percentage of the game's own cost, so 100 leaves that
; kind alone and 0 removes it. A value outside 0 to 100 refuses the whole
; write, including whichever settings were in range.
;
; Skills that give stamina back are never touched, so food and rest restore
; what they always did. The one exception is MountRegenPercent below, which
; exists because a horse works the other way round.
;
; The log is StaminaMaster.log, next to the plugin in bin64. The sessions
; before it are StaminaMaster.01.log upwards, newest first.

[settings]

; Costs charged once per use: a roll, a jump, each swing of a weapon. 130 of
; them.
UsePercent=0

; Drains that run for as long as you hold them: sprinting, climbing, swimming,
; the glider, the rocket pack. 61 of them.
;
; It also covers channelled attacks, a held grapple and the war machine's
; flamethrower, because those drain continuously too. The game keeps no flag
; that separates travelling from fighting, so this is drawn on how a cost is
; charged rather than on what the skill is for.
ContinuousPercent=0

; Anything you do while mounted that costs stamina, held or tapped. 15 of them.
MountPercent=0

; A horse does not work like you do. Its gait is a recovery rate that falls as
; it speeds up, +100000 a tick standing still and +9000 at a full gallop, and
; its stamina drops at speed because something drains faster than that. Setting
; MountPercent to 0 removes the one mounted cost there is and a galloping horse
; still tires, so this raises the recovery instead.
;
; A percentage of the game's own rate, 100 to 10000, where 100 leaves it alone.
; At 1000 a full gallop recovers 90000 a tick, near enough what standing still
; gives. Below 100 is refused; making a horse tire faster is not what this is
; for.
MountRegenPercent=1000

; Write the research report as well, and a line per number changed with the
; kind it was counted as. Useful for a bug report and noisy otherwise.
Probe=0
