; Unlimited Stamina 0.1.0 for Crimson Desert 2.03.00 (exe 1.0.0.2944).
;
; The mod multiplies the stamina cost of everything you do by UsePercent. It
; reaches sprinting, climbing, swimming, the glider, the mount and every other
; skill the game charges stamina for, because it changes the one number each of
; those skills keeps rather than patching them one at a time.
;
; The log is UnlimitedStamina.log, next to the plugin in bin64. The sessions
; before it are UnlimitedStamina.01.log upwards, newest first.

[settings]

; Percent of the game's own stamina cost to keep, 0 to 100.
;
;   100  the game's own costs, unchanged, and nothing is written
;    75  a quarter cheaper
;    50  half
;    25  a quarter of normal, the default
;    10  a tenth
;     0  no stamina cost at all
;
; Anything outside 0 to 100 is refused and nothing is written.
;
; Skills that give stamina back are never touched, whatever this is set to, so
; food and rest still restore what they always did.
UsePercent=25

; Write the research report as well, and a line per skill changed. Useful for
; a bug report and noisy otherwise.
Probe=0
