; Unlimited Stamina 0.1.0 for Crimson Desert 2.03.00 (exe 1.0.0.2944).
;
; The mod multiplies the stamina cost of what you do. Each setting below is a
; percentage of the game's own cost, 0 to 100, where 100 leaves that kind alone
; and 0 removes its cost outright. Anything outside that range is refused and
; nothing at all is written.
;
; Skills that give stamina back are never touched, whatever these are set to,
; so food and rest still restore what they always did.
;
; The log is UnlimitedStamina.log, next to the plugin in bin64. The sessions
; before it are UnlimitedStamina.01.log upwards, newest first.

[settings]

; Costs charged once per use: a roll, a jump, each swing of a weapon. 130 of
; them.
UsePercent=25

; Drains that run for as long as you hold them: sprinting, climbing, swimming,
; the glider, the rocket pack. 61 of them. This is the one that decides how far
; you can go without stopping, which is why it starts lower than the rest.
;
; It also covers channelled attacks, a held grapple and the war machine's
; flamethrower, because those drain continuously too. The game keeps no flag
; that separates travelling from fighting, so this is drawn on how a cost is
; charged rather than on what the skill is for.
ContinuousPercent=10

; Anything you do while mounted, held or tapped. 15 of them.
MountPercent=25

; Write the research report as well, and a line per skill changed with the kind
; it was counted as. Useful for a bug report and noisy otherwise.
Probe=0
